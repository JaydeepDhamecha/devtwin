[project]
name = "devtwin-mcp"
version = "0.1.0"
description = "MCP server that gives AI coding agents a live, structured understanding of a developer's local environment"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "DevTwin Contributors" }]
keywords = ["mcp", "model-context-protocol", "devtools", "diagnostics", "developer-experience"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/JaydeepDhamecha/devtwin"
Repository = "https://github.com/JaydeepDhamecha/devtwin"
Issues = "https://github.com/JaydeepDhamecha/devtwin/issues"

[project.scripts]
devtwin = "devtwin.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devtwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires external tools/services to be installed",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = ["tests/fixtures", "examples"]
